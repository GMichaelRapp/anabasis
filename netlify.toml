# The product site: anabasis.zerohistory.net
# The front page (web/) follows main; the app it serves is always the latest published release.
[build]
  publish = "site"
  command = """
    mkdir -p dist &&
    curl -fsSL --retry 3 -o dist/anabasis.html https://github.com/gmichaelrapp/anabasis/releases/latest/download/anabasis.html &&
    python3 tools/site/build_web.py
  """

[build.environment]
  PYTHON_VERSION = "3.12"
