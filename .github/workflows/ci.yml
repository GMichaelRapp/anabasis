name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes with git, so the token is not left on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build
        run: python build.py --check
      - name: Test suites
        run: python tests/run_tests.py
      - name: Test suites without newer browser APIs
        run: python tests/run_tests.py --degraded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: anabasis-${{ github.sha }}
          path: |
            dist/anabasis.html
            tests/out/*.log
            tests/out/*.png
          retention-days: 14

  engines:
    name: Smoke test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes with git, so the token is not left on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python build.py
      - name: Opened from disk
        run: python tests/smoke.py --browser ${{ matrix.browser }}
      - name: Served over HTTP
        run: python tests/smoke.py --browser ${{ matrix.browser }} --http
