name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # nothing here pushes with git, so the token is not left on disk
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build
        run: python build.py --check
      - name: Test suites
        run: python tests/run_tests.py
      - name: Test suites without newer browser APIs
        run: python tests/run_tests.py --degraded
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: anabasis-${{ github.sha }}
          path: |
            dist/anabasis.html
            tests/out/*.log
            tests/out/*.png
          retention-days: 14

  engines:
    name: Smoke test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # nothing here pushes with git, so the token is not left on disk
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python build.py
      - name: Opened from disk
        run: python tests/smoke.py --browser ${{ matrix.browser }}
      - name: Served over HTTP
        run: python tests/smoke.py --browser ${{ matrix.browser }} --http
