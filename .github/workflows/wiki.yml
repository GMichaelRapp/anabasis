name: Publish the wiki

# The wiki's pages live in docs/wiki/ in this repository, so they're reviewed like any other change.
# On every push that touches them, this copies docs/wiki/ into the GitHub wiki and pushes it.
# Edits made directly on the wiki are replaced the next time this runs: change docs/wiki/ instead.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes with git, so the token is not left on disk
      - name: Copy docs/wiki into the wiki and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The wiki is already up to date."; exit 0; fi
          git commit -m "Update the wiki from ${GITHUB_SHA::7}"
          git push
