name: Release

# Push a tag such as v1.0.0 to publish a release. The tag must match APP_VERSION in src/app.js.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches the app version
        run: |
          v=$(grep -oP "const APP_VERSION = '\K[^']+" src/app.js)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match APP_VERSION $v"; exit 1; fi
      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build
        run: python build.py --check
      - name: Test
        run: python tests/run_tests.py
      - name: Package
        run: |
          cd dist
          sha256sum anabasis.html > SHA256SUMS.txt
          # release notes: the changelog section for this version
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' ../CHANGELOG.md > notes.md
          printf '\n---\n**Download `anabasis.html`**, open it in your browser, and choose Save to keep your project. SHA-256 checksum in `SHA256SUMS.txt`.\n' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/anabasis.html dist/SHA256SUMS.txt \
            --title "Anabasis ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --verify-tag
