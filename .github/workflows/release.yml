name: Release

# Publish a release: push a tag such as v1.0.0, or run this workflow from the Actions tab
# (Run workflow, enter 1.0.0). Either way the version must match APP_VERSION in src/app.js.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, matching APP_VERSION (for example 1.0.0)
        required: true

permissions:
  contents: write      # to publish the release
  actions: write       # to start the Pages and zerohistory.net workflows after publishing
  id-token: write      # to sign the build provenance
  attestations: write  # to record it, so anyone can check a download with `gh attestation verify`

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes with git, so the token is not left on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check the version matches the app
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v=$(grep -oP "const APP_VERSION = '\K[^']+" src/app.js)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="v${INPUT_VERSION#v}"; else tag="$GITHUB_REF_NAME"; fi
          if [ "v$v" != "$tag" ]; then echo "Release $tag doesn't match APP_VERSION $v"; exit 1; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build
        run: python build.py --check
      - name: Test
        run: python tests/run_tests.py
      - name: Package
        run: |
          cd dist
          sha256sum anabasis.html > SHA256SUMS.txt
          # release notes: the changelog section for this version
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' ../CHANGELOG.md > notes.md
          printf '\n---\n**Download `anabasis.html`**, open it in your browser, and choose Save to keep your project. SHA-256 checksum in `SHA256SUMS.txt`; to check where it was built, run `gh attestation verify anabasis.html -R gmichaelrapp/anabasis`.\n' >> notes.md
      - name: Sign build provenance (where, from which commit and by which workflow the file was built)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/anabasis.html
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # creates the tag on this commit if it doesn't exist yet
          gh release create "$TAG" dist/anabasis.html dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Anabasis ${TAG#v}" --notes-file dist/notes.md
      - name: Update the hosted copy
        # A release made with the workflow's own token doesn't trigger other workflows, so start Pages and zerohistory.net directly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run site.yml --ref main
